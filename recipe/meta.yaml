{% set name = "pikepdf" %}
{% set version = "10.11.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4bebc59ac74411064e7c97a4036174023e22ccbecd22b78750ab76551eb38988

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv  # [unix]
    # pikepdf.h(24,10): error C1083: Cannot open include file: 'qpdf/Constants.h': No such file or directory
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv --config-settings=cmake.args="-DCMAKE_PREFIX_PATH=%PREFIX%\Library"
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make  # [unix]
    - ninja-base  # [win]
  host:
    - pip
    - python
    - scikit-build-core>=0.10
    - nanobind >=2.0
    - qpdf =12.3.2
  run:
    - python
    - pillow >=10.0.1
    - lxml >=4.8    
    - packaging
    - qpdf =12.3.2

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - pikepdf
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest >=6.2.5
    - python-dateutil >=2.8.1
    - attrs >=20.2.0
    - hypothesis >=6.36
    - numpy >=1.21  # [x86_64]
    - psutil >=5.9  # [not win]
    - tomli  # [py<311]
  

about:
  home: https://github.com/pikepdf/pikepdf
  license: MPL-2.0
  license_family: OTHER
  license_file: LICENSE.txt
  summary: A Python library for reading and writing PDF, powered by qpdf
  description: |
    pikepdf is a Python library allowing creation, manipulation and repair of PDFs. It provides a Pythonic wrapper
    around the C++ PDF content transformation library, QPDF.
  doc_url: https://pikepdf.readthedocs.io
  dev_url: https://github.com/pikepdf/pikepdf

extra:
  recipe-maintainers:
    - carlodri
  skip-lints:
    - invalid_url
